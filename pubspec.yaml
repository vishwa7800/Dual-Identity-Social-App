name: shrowd
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4
  provider: ^6.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#000000"
  # I am removing the image from here so the boot process is a clean black screen.
  # This prevents the "double logo" jump.
  android_12:
    color: "#000000"
  fullscreen: true
